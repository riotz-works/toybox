name: CI/CD App Base Infra

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!wip/**'
    paths:
      - '.github/workflows/ci-cd-app-base-infra.yml'
      - 'infra/bin/app.ts'
      - 'infra/lib/config.ts'
      - 'infra/lib/util.ts'
      - 'infra/lib/construct/**'
      - 'infra/lib/stack/app-base-infra.ts'
      - 'infra/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'


permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  NODE_OPTIONS: --max-old-space-size=4096
  aws-account-id-dev: 807845208391
  aws-account-id-prd: 807845208391
  matrix-node-versions: 24


jobs:
  init:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: echo "matrix=[ $MATRIX_NODE_VERSIONS ]" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_NODE_VERSIONS: ${{ env.matrix-node-versions }}

  setup:
    needs: [ init ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Setup
        run: |
          pnpm run setup


  build-status:
    needs: [ tsc ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Build Status
        run: echo "Building completed successfully"

  tsc:
    needs: [ init, setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: TypeScript Build
        run: |
          pnpm run setup
          pnpm run build


  lint-status:
    needs: [ eslint, knip ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Lint Status
        run: echo "Linting completed successfully"

  eslint:
    needs: [ init, setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: ESLint
        run: |
          pnpm run setup
          pnpm run lint:eslint --max-warnings "$(grep -oE "eslint-max-warnings: [0-9]+" ./.github/workflows/pull-request-review.yml | grep -oE "[0-9]+")"

  knip:
    needs: [ setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Knip
        run: |
          pnpm run setup
          pnpm run lint:knip


  package-status:
    needs: [ cdk ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Package Status
        run: echo "Packaging completed successfully"

  cdk:
    needs: [ setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Determine Stage
        id: determine-stage
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          if [ "$BRANCH_NAME" = "production" ]; then
            STAGE_NAME="prd"
          elif [ "$BRANCH_NAME" = "stable" ]; then
            STAGE_NAME="stg"
          elif [ "${BRANCH_NAME#qa/}" != "$BRANCH_NAME" ]; then
            STAGE_NAME="$(printf '%s\n' "$BRANCH_NAME" | cut -d'/' -f2)"
          else
            STAGE_NAME="dev"
          fi

          echo "Branch: $BRANCH_NAME"
          echo "Stage: $STAGE_NAME"
          echo "stage_name=$STAGE_NAME" >> "$GITHUB_OUTPUT"
      - name: Determine Role
        id: determine-role
        run: |
          if [ "$STAGE_NAME" = "stg" ] || [ "$STAGE_NAME" = "prd" ]; then
            ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID_PRD}:role/sys-ci-toybox-readonly"
          else
            ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID_DEV}:role/sys-ci-toybox-readonly"
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
        env:
          STAGE_NAME: ${{ steps.determine-stage.outputs.stage_name }}
          AWS_ACCOUNT_ID_DEV: ${{ env.aws-account-id-dev }}
          AWS_ACCOUNT_ID_PRD: ${{ env.aws-account-id-prd }}
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: 'us-east-1'
          role-to-assume: ${{ steps.determine-role.outputs.role_arn }}
          role-session-name: gha-oreo-${{ github.run_id }}
      - name: Package
        run: |
          pnpm run setup
          pnpm infra run synth:app --context stage="$STAGE_NAME"
        env:
          STAGE_NAME: ${{ steps.determine-stage.outputs.stage_name }}


  check-status:
    needs: [ build-status, lint-status, package-status ]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check Status
        run: |
          # Note: Add check implementation when needs are increased
          FAILED=0
          [ "$BUILD_STATUS_RESULT" = "success" ] || FAILED=$((FAILED + 1))
          [ "$LINT_STATUS_RESULT" = "success" ] || FAILED=$((FAILED + 1))
          [ "$PACKAGE_STATUS" = "success" ] || FAILED=$((FAILED + 1))

          if [ "$FAILED" -ne 0 ]; then
            echo "::error ::$FAILED required jobs failed or were cancelled"
            exit 1
          fi
          echo "Checking completed successfully"
        env:
          BUILD_STATUS_RESULT: ${{ needs.build-status.result }}
          LINT_STATUS_RESULT: ${{ needs.lint-status.result }}
          PACKAGE_STATUS: ${{ needs.package-status.result }}


  deploy-to-dev-stage:
    if: github.ref == 'refs/heads/main'
    needs: [ check-status ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: lts/*
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: 'us-east-1'
          role-to-assume: 'arn:aws:iam::${{ env.aws-account-id-dev }}:role/sys-ci-toybox-deploy'
          role-session-name: gha-oreo-${{ github.run_id }}
      - name: Deploy to Dev
        run: |
          pnpm run setup
          pnpm infra run deploy:app-base --context stage=dev --require-approval never

  deploy-to-qas-stage:
    if: startsWith(github.ref, 'refs/heads/qa/')
    needs: [ check-status ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: lts/*
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: 'us-east-1'
          role-to-assume: 'arn:aws:iam::${{ env.aws-account-id-dev }}:role/sys-ci-toybox-deploy'
          role-session-name: gha-oreo-${{ github.run_id }}
      - name: Check QA Branches
        id: check_branches
        run: |
          # Expect branch name format: qa/<env-name>[/...]
          CURRENT_BRANCH="$(git branch --show-current)"
          QA_ENV="$(printf '%s\n' "$CURRENT_BRANCH" | cut -d'/' -f2)"

          if [ -z "$QA_ENV" ]; then
            echo "Failed to detect QA environment name from branch: $CURRENT_BRANCH"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected QA environment: $QA_ENV"

          OLDEST=$(git branch -r | grep "origin/qa/$QA_ENV" | sort | head -n 1 | sed 's| *origin/||')
          if [ -z "$OLDEST" ]; then
            echo "No remote QA branches found for environment: $QA_ENV"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Current branch : $CURRENT_BRANCH"
          echo "Oldest QA branch for env '$QA_ENV' : $OLDEST"
          if [ "$CURRENT_BRANCH" != "$OLDEST" ]; then
            echo "Exit without deploying because it is not the oldest QA branch for environment '$QA_ENV'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "qa_env=$QA_ENV" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to QAS
        if: steps.check_branches.outputs.skip != 'true'
        run: |
          pnpm run setup
          pnpm infra run deploy:app-base --context stage="$STAGE_NAME" --require-approval never
        env:
          HEAD_REF: ${{ github.head_ref }}
          STAGE_NAME: ${{ steps.check_branches.outputs.qa_env }}

  deploy-to-stg-stage:
    if: github.ref == 'refs/heads/stable'
    needs: [ check-status ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: lts/*
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: 'us-east-1'
          role-to-assume: 'arn:aws:iam::${{ env.aws-account-id-prd }}:role/sys-ci-toybox-deploy'
          role-session-name: gha-oreo-${{ github.run_id }}
      - name: Deploy to Staging
        run: |
          pnpm run setup
          pnpm infra run deploy:app-base --context stage=stg --require-approval never

  deploy-to-prd-stage:
    if: github.ref == 'refs/heads/production'
    needs: [ check-status ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version: lts/*
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: 'us-east-1'
          role-to-assume: 'arn:aws:iam::${{ env.aws-account-id-prd }}:role/sys-ci-toybox-deploy'
          role-session-name: gha-oreo-${{ github.run_id }}
      - name: Deploy to Production
        run: |
          pnpm run setup
          pnpm infra run deploy:app-base --context stage=prd --require-approval never
