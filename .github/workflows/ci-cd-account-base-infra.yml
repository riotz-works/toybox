name: CI/CD Account Base Infra

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!wip/**'
    paths:
      - '.github/workflows/ci-cd-account-base-infra.yml'
      - 'infra/bin/account.ts'
      - 'infra/lib/config.ts'
      - 'infra/lib/construct/base/output.ts'
      - 'infra/lib/stack/account-base-infra.ts'
      - 'infra/lib/util.ts'
      - 'infra/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'


permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  NODE_OPTIONS: --max-old-space-size=4096
  matrix-node-versions: 24
  repository: toybox
  role-readonly-np: arn:aws:iam::807845208391:role/sys-ci-toybox-readonly-np
  role-readonly-prd: arn:aws:iam::807845208391:role/sys-ci-toybox-readonly
  role-deploy-np: arn:aws:iam::807845208391:role/sys-ci-toybox-deploy-np
  role-deploy-prd: arn:aws:iam::807845208391:role/sys-ci-toybox-deploy


jobs:
  init:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: echo "matrix=[ $MATRIX_NODE_VERSIONS ]" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_NODE_VERSIONS: ${{ env.matrix-node-versions }}

  setup:
    needs: [ init ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Setup
        run: |
          pnpm run setup


  build-status:
    needs: [ tsc ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Build Status
        run: echo "Building completed successfully"

  tsc:
    needs: [ init, setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: TypeScript Build
        run: |
          pnpm run setup
          pnpm run build


  lint-status:
    needs: [ eslint, knip ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Lint Status
        run: echo "Linting completed successfully"

  eslint:
    needs: [ init, setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: ESLint
        run: |
          pnpm run setup
          pnpm run lint:eslint --max-warnings "$(grep -oE "eslint-max-warnings: [0-9]+" ./.github/workflows/pull-request-review.yml | grep -oE "[0-9]+")"

  knip:
    needs: [ setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Knip
        run: |
          pnpm run setup
          pnpm run lint:knip


  package-status:
    needs: [ cdk ]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Package Status
        run: echo "Packaging completed successfully"

  cdk:
    needs: [ setup ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Setup Dependencies
        run: |
          pnpm run setup
      - uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        if: github.ref != 'refs/heads/stable' && github.ref != 'refs/heads/production'
        with:
          aws-region: 'us-east-1'
          role-to-assume: '${{ env.role-readonly-np }}'
          role-session-name: gha-${{ env.repository }}-${{ github.run_id }}
      - name: Package Dev
        if: github.ref != 'refs/heads/stable' && github.ref != 'refs/heads/production'
        run: |
          pnpm infra run synth:account --context stage=np
      - uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/production'
        with:
          aws-region: 'us-east-1'
          role-to-assume: '${{ env.role-readonly-prd }}'
          role-session-name: gha-${{ env.repository }}-${{ github.run_id }}
      - name: Package Production
        if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/production'
        run: |
          pnpm infra run synth:account --context stage=prd


  check-status:
    needs: [ build-status, lint-status, package-status ]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check Status
        run: |
          # Note: Add check implementation when needs are increased
          FAILED=0
          [ "$BUILD_STATUS_RESULT" = "success" ] || FAILED=$((FAILED + 1))
          [ "$LINT_STATUS_RESULT" = "success" ] || FAILED=$((FAILED + 1))
          [ "$PACKAGE_STATUS" = "success" ] || FAILED=$((FAILED + 1))

          if [ "$FAILED" -ne 0 ]; then
            echo "::error ::$FAILED required jobs failed or were cancelled"
            exit 1
          fi
          echo "Checking completed successfully"
        env:
          BUILD_STATUS_RESULT: ${{ needs.build-status.result }}
          LINT_STATUS_RESULT: ${{ needs.lint-status.result }}
          PACKAGE_STATUS: ${{ needs.package-status.result }}


  deploy-to-dev-stage:
    if: github.ref == 'refs/heads/main'
    needs: [ check-status ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: '' # 'cuz to prevent cache poisoning
          package-manager-cache: false
      - uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          aws-region: 'us-east-1'
          role-to-assume: '${{ env.role-deploy-np }}'
          role-session-name: gha-${{ env.repository }}-${{ github.run_id }}
      - name: Deploy to Dev
        run: |
          pnpm run setup
          pnpm infra run deploy:account --context stage=np --require-approval never

  deploy-to-prd-stage:
    if: github.ref == 'refs/heads/production'
    needs: [ check-status ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC authentication to AWS
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: '' # 'cuz to prevent cache poisoning
          package-manager-cache: false
      - uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          aws-region: 'us-east-1'
          role-to-assume: '${{ env.role-deploy-prd }}'
          role-session-name: gha-${{ env.repository }}-${{ github.run_id }}
      - name: Deploy to Production
        run: |
          pnpm run setup
          pnpm infra run deploy:account --context stage=prd --require-approval never
